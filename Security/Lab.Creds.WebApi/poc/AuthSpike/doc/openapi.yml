openapi: 3.0.3
info:
  title: AuthSpike Orders API
  version: 0.1.0
  description: |
    建立訂單 API 的 API First 契約（spike）。以 OAuth 2.0 Opaque Token 驗證，
    Token 必須搭配取得它時所用的同一張 mTLS 用戶端憑證。
    所有業務呼叫另需 HTTP Message Signatures（RFC 9421，ecdsa-p256-sha256）；簽章金鑰須屬於 Token 所識別的 Client。
    建立訂單（POST /orders）需涵蓋 content-digest（RFC 9530）、content-type 與 Idempotency-Key；其他有 Body 的 POST（取消訂單）涵蓋 content-digest 與 content-type，不需 Idempotency-Key（取消天生冪等）；無 Body 的 GET 涵蓋 @method、@target-uri、@query 與 authorization。
    簽章規則為 lab 提案，待使用者確認（見 03 單）。
    防重放（見 04 單，lab 暫定待使用者確認）：簽章 created 不超前超過 30 秒、有效期（expires - created）不超過 60 秒、未達 expires 才接受；同一 Client 的 nonce 只能被接受一次，跨建立訂單 API 執行個體一致；重放回應 401。
    防重放狀態無法可靠讀寫時回應 503（error: replay_state_unavailable），且不進入業務副作用。防重放不等於業務冪等（業務去重屬 06 單）。
    撤銷（見 07 單）：Client 停用、mTLS 憑證撤銷、簽章金鑰撤銷或 Token 撤銷後，各驗證端於 60 秒內拒絕後續請求（回應 401，含既有連線）。
    停用 Client 或輪替憑證不會使既有 Token 被 introspection 判為無效；接受判斷另檢查 Client、憑證與簽章金鑰的有效狀態。撤銷不回滾已提交的訂單。
    查證服務無法連線且沒有時效內有效的快取時回應 503（error: verification_unavailable），不回應 401、不進入業務副作用；快取到期不因查證失敗而延長。
    安全稽核（見 09 單，lab 暫定待使用者確認）：每筆業務請求回應帶 X-Correlation-Id 標頭並留下一筆稽核紀錄，回應送出時補記最終業務結果 HTTP 狀態碼（201／409／422／503 等）；（已驗證 Client 僅在簽章通過時記錄；失敗請求宣稱的身分標示為未驗證；紀錄不含 Token、私鑰、簽章基底或 Body）。稽核紀錄無法寫入時回應 503（error: audit_unavailable），不進入業務副作用，也不假報成功；稽核紀錄不經 API 公開。
    操作權限：Token 須含該操作所需的 scope（orders.read 讀取、orders.write 建立與取消）；缺少時回應 403。
    資料範圍：讀取與取消只限已驗證 Client 自己建立的訂單，他人訂單回應 404；Body、查詢參數與路徑宣稱的 clientId 一律忽略。
    授權資料來源為授權伺服器對各 Client 的核准 scope 登錄（lab 內記憶體登錄，見 05 單）。
    業務去重（見 06 單，lab 暫定待使用者確認）：建立訂單的穩定業務識別為 client_id 加 orderReference（同一 Client 內唯一）；Idempotency-Key 只定位請求嘗試，範圍為 client_id 加 Idempotency-Key。
    業務內容比對為 item 與 quantity；nonce、簽章與 Token 不參與比對。同一業務識別且內容相同且已完成時，回傳既有訂單（201，標頭 Idempotent-Replayed: true），不重做副作用。
    同一業務識別仍處理中時回應 409（error: operation_in_progress，status: processing），不啟動第二次執行。同一 Idempotency-Key 或同一業務識別但內容不同時回應 422（error: idempotency_key_conflict 或 order_reference_conflict），不覆寫既有操作。
    最長重試期 10 分鐘；Idempotency-Key 紀錄保存 24 小時（涵蓋重試期）；業務識別與訂單結果不因 Key 紀錄過期而失去唯一性。處理中租約 30 秒，到期後同一業務操作可由新嘗試接手（舊嘗試於提交時被辨識為已失效，不會再提交）。
    本地提交保證：本業務服務內，同一業務操作的本地訂單只提交一次；不宣稱下游或跨系統 exactly-once（下游冪等協定另訂）。提交前當機不產生訂單；提交後回應遺失時重試回傳既有結果。
    業務提交無法確認時回應 503（error: business_commit_unavailable），呼叫端須以同一業務識別重試。
servers:
  - url: https://localhost:7444
paths:
  /orders:
    post:
      operationId: createOrder
      summary: 建立訂單
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: "訂單已建立；若同一業務識別與內容已完成，回傳既有訂單（標頭 Idempotent-Replayed: true），不重做副作用"
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              description: 僅於回傳既有結果時出現，值為 true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '401':
          description: 未驗證；Token 無效、已到期、目標 API 不符，或 Token 與用戶端憑證不符（cnf 綁定不成立）；或簽章缺漏、過期、內容／目標／標頭被竄改、金鑰不屬於已驗證 Client
        '400':
          description: "缺少或不合法的 orderReference（error: order_reference_invalid）或缺少 Idempotency-Key（error: idempotency_key_required）"
        '403':
          description: Token 有效但缺少 orders.write scope
        '409':
          description: "同一業務識別的操作仍處理中（error: operation_in_progress，status: processing）；不啟動第二次執行，請稍後以同一業務識別重試"
        '422':
          description: "同一 Idempotency-Key 對應不同業務識別（error: idempotency_key_conflict），或同一業務識別的業務內容不同（error: order_reference_conflict）；不覆寫既有操作"
        '503':
          description: "查證服務暫時無法驗證（error: verification_unavailable）、防重放狀態暫時無法可靠讀寫（error: replay_state_unavailable）、稽核紀錄無法寫入（error: audit_unavailable）或業務提交無法確認（error: business_commit_unavailable）；不建立訂單或已確認的結果請以同一業務識別重試"
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: 查詢訂單（無 Body）
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 訂單內容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
        '401':
          description: 未驗證或簽章不成立
        '403':
          description: Token 有效但缺少 orders.read scope
        '404':
          description: 訂單不存在，或不屬於已驗證 Client（業務資料範圍檢查）
        '503':
          description: "查證服務暫時無法驗證（error: verification_unavailable）、防重放狀態暫時無法可靠讀寫或稽核紀錄無法寫入（error: audit_unavailable）；不回應業務資料"
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: 取消訂單（修改訂單狀態；有 Body 的 POST，Body 為空物件 {}）
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 目前無欄位，送出空物件 {}。
      responses:
        '200':
          description: 訂單已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
        '401':
          description: 未驗證或簽章不成立
        '403':
          description: Token 有效但缺少 orders.write scope
        '404':
          description: 訂單不存在，或不屬於已驗證 Client；他人訂單不會被修改
        '503':
          description: "查證服務暫時無法驗證（error: verification_unavailable）、防重放狀態暫時無法可靠讀寫或稽核紀錄無法寫入（error: audit_unavailable）；訂單不會被取消"
  # 以下為授權伺服器的登錄與管理介面（11、12、13、14、15 單）。路徑、欄位與回應格式為 lab 暫定值，待使用者確認。
  # 驗證方式：申請端點不需驗證（申請管道待確認，見 ADR 0001）；管理端點只接受已登錄為管理角色的 mTLS 用戶端憑證（非 Bearer Token），其他呼叫一律 401。
  /client-certificate-requests:
    post:
      operationId: submitClientCertificateRequest
      summary: 提交憑證登錄申請（只含公開憑證；申請本身不改變信任名單，也不能用於取得 Token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRegistrationSubmission'
      responses:
        '202':
          description: 申請已受理，狀態為 pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestAccepted'
        '400':
          description: "申請內容不合法（error: invalid_certificate）或含私鑰（error: private_key_not_allowed）"
        '404':
          description: "找不到 Client（error: client_not_found）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；申請不被受理"
  /signing-key-requests:
    post:
      operationId: submitSigningKeyRequest
      summary: 提交簽章金鑰登錄申請（只含 keyId 與公開金鑰；待核准前不通過簽章驗證）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningKeySubmission'
      responses:
        '202':
          description: 申請已受理，狀態為 pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestAccepted'
        '400':
          description: "申請內容不合法（error: invalid_public_key）或含私鑰（error: private_key_not_allowed）"
        '404':
          description: "找不到 Client（error: client_not_found）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；申請不被受理"
  /admin/trust-list:
    get:
      operationId: getTrustList
      summary: 讀取信任名單（管理員）
      responses:
        '200':
          description: 各 Client 的信任名單；已退役或已撤銷的憑證不列入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustListResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
  /admin/audit-records:
    get:
      operationId: listAdministrativeAuditRecords
      summary: 查詢管理操作稽核紀錄（管理員；讀取不寫入稽核）
      responses:
        '200':
          description: 管理操作稽核紀錄；不含私鑰與原始 Token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdministrativeAuditRecord'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
  /admin/clients/{clientId}/disable:
    post:
      operationId: disableClient
      summary: 停用 Client（管理員；未經 Spec 要求的管理操作，保留為 lab 暫定，待使用者確認）
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client 已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDisabledResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到 Client（error: client_not_found）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；Client 不被停用"
  /admin/clients/{clientId}/certificates/{thumbprint}/retire:
    post:
      operationId: retireClientCertificate
      summary: 退役 Client 的 mTLS 憑證（管理員；需已有可用的替代憑證）
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Thumbprint'
      responses:
        '200':
          description: 憑證已退役
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateChangeResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到 Client（error: client_not_found）或憑證（error: certificate_not_found）"
        '409':
          description: "狀態衝突：已撤銷（already_revoked）、已退役（already_retired）、與其他 Client 共用（certificate_shared）或無替代憑證（replacement_required）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；狀態不變"
  /admin/clients/{clientId}/certificates/{thumbprint}/revoke:
    post:
      operationId: revokeClientCertificate
      summary: 撤銷 Client 的 mTLS 憑證（管理員；不需替代憑證，各驗證端於 60 秒內拒絕）
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Thumbprint'
      responses:
        '200':
          description: 憑證已撤銷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateChangeResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到 Client（error: client_not_found）或憑證（error: certificate_not_found）"
        '409':
          description: "狀態衝突：已撤銷（already_revoked）、已退役（already_retired）或與其他 Client 共用（certificate_shared）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；狀態不變"
  /admin/clients/{clientId}/signing-keys/{keyId}/retire:
    post:
      operationId: retireClientSigningKey
      summary: 退役 Client 的簽章金鑰（管理員；需已有可用的替代金鑰）
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          description: 簽章金鑰已退役
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyChangeResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到 Client（error: client_not_found）或金鑰（error: signing_key_not_found）"
        '409':
          description: "狀態衝突：已撤銷（already_revoked）、已退役（already_retired）、與其他 Client 共用（signing_key_shared）或無替代金鑰（replacement_required）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；狀態不變"
  /admin/clients/{clientId}/signing-keys/{keyId}/revoke:
    post:
      operationId: revokeClientSigningKey
      summary: 撤銷 Client 的簽章金鑰（管理員；不需替代金鑰，各驗證端於 60 秒內拒絕）
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          description: 簽章金鑰已撤銷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyChangeResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到 Client（error: client_not_found）或金鑰（error: signing_key_not_found）"
        '409':
          description: "狀態衝突：已撤銷（already_revoked）、已退役（already_retired）或與其他 Client 共用（signing_key_shared）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；狀態不變"
  /admin/client-certificate-requests/{requestId}:
    get:
      operationId: getCertificateRegistrationRequest
      summary: 查詢憑證登錄申請狀態（管理員）
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申請狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRequestStatusResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到申請（error: request_not_found）"
  /admin/client-certificate-requests/{requestId}/approve:
    post:
      operationId: approveCertificateRegistrationRequest
      summary: 核准憑證登錄申請（管理員；核准後才進入信任名單）
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申請已核准，憑證已進入信任名單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestDecision'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到申請（error: request_not_found）"
        '409':
          description: "申請非待核准（request_not_pending）或同一指紋已在任一 Client 的信任名單（certificate_already_registered）；信任名單不變"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；申請維持待核准"
  /admin/client-certificate-requests/{requestId}/reject:
    post:
      operationId: rejectCertificateRegistrationRequest
      summary: 拒絕憑證登錄申請（管理員；不改變信任名單）
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申請已拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestDecision'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到申請（error: request_not_found）"
        '409':
          description: "申請非待核准（error: request_not_pending）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；申請維持待核准"
  /admin/signing-key-requests/{requestId}:
    get:
      operationId: getSigningKeyRegistrationRequest
      summary: 查詢簽章金鑰登錄申請狀態（管理員）
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申請狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyRequestStatusResponse'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到申請（error: request_not_found）"
  /admin/signing-key-requests/{requestId}/approve:
    post:
      operationId: approveSigningKeyRegistrationRequest
      summary: 核准簽章金鑰登錄申請（管理員；只登錄到申請它的 Client 名下）
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申請已核准，金鑰已登錄為驗簽金鑰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestDecision'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到申請（error: request_not_found）"
        '409':
          description: "申請非待核准（request_not_pending）或 keyId 已登錄於任一 Client（signing_key_id_in_use）；驗簽登錄不變"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；申請維持待核准"
  /admin/signing-key-requests/{requestId}/reject:
    post:
      operationId: rejectSigningKeyRegistrationRequest
      summary: 拒絕簽章金鑰登錄申請（管理員；不登錄驗簽金鑰）
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申請已拒絕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestDecision'
        '401':
          description: "未經管理員驗證（error: administrator_authentication_required）"
        '404':
          description: "找不到申請（error: request_not_found）"
        '409':
          description: "申請非待核准（error: request_not_pending）"
        '503':
          description: "稽核紀錄無法寫入（error: audit_unavailable）；申請維持待核准"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
  schemas:
    CreateOrderRequest:
      type: object
      required: [orderReference, item, quantity]
      properties:
        orderReference:
          type: string
          maxLength: 64
          description: 穩定業務識別（client_id 範圍內唯一）；重試時必須沿用同一值。
        item:
          type: string
        quantity:
          type: integer
    CreateOrderResponse:
      type: object
      required: [orderId, clientId]
      properties:
        orderId:
          type: string
          format: uuid
        clientId:
          type: string
          description: 由已驗證 Token 的 client_id 取得；不採信 Body 或外部標頭宣稱的身分。
    GetOrderResponse:
      type: object
      required: [orderId, clientId, item, quantity, status]
      properties:
        orderId:
          type: string
          format: uuid
        clientId:
          type: string
        item:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [active, cancelled]
    CertificateRegistrationSubmission:
      type: object
      required: [clientId, publicCertificatePem]
      description: 只含 Client 身分與公開憑證（PEM）；含私鑰的內容一律拒絕（private_key_not_allowed）。
      properties:
        clientId:
          type: string
        publicCertificatePem:
          type: string
    SigningKeySubmission:
      type: object
      required: [clientId, keyId, publicKeyPem]
      description: 只含 Client 身分、keyId 與 ECDSA P-256 公開金鑰（SubjectPublicKeyInfo PEM）；含私鑰的內容一律拒絕。
      properties:
        clientId:
          type: string
        keyId:
          type: string
        publicKeyPem:
          type: string
    RegistrationRequestAccepted:
      type: object
      required: [requestId, clientId, status]
      properties:
        requestId:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum: [pending]
    RegistrationRequestDecision:
      type: object
      required: [requestId, clientId, status]
      properties:
        requestId:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum: [approved, rejected]
    CertificateRequestStatusResponse:
      type: object
      required: [requestId, clientId, thumbprint, status]
      properties:
        requestId:
          type: string
        clientId:
          type: string
        thumbprint:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
    SigningKeyRequestStatusResponse:
      type: object
      required: [requestId, clientId, keyId, status]
      properties:
        requestId:
          type: string
        clientId:
          type: string
        keyId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
    TrustListResponse:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items:
            type: object
            required: [clientId, enabled, certificateThumbprints]
            properties:
              clientId:
                type: string
              enabled:
                type: boolean
              certificateThumbprints:
                type: array
                description: 未退役、未撤銷的憑證指紋。
                items:
                  type: string
    AdministrativeAuditRecord:
      type: object
      description: 管理操作稽核紀錄；只含指紋，不含私鑰、原始 Token 或完整 Body。
      properties:
        correlationId:
          type: string
        occurredAt:
          type: string
          format: date-time
        operation:
          type: string
          example: certificate.approve
        actorStatus:
          type: string
          enum: [已驗證管理員, 未驗證]
        actorThumbprint:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
          enum: [certificate, signing_key]
        keyId:
          type: string
          nullable: true
        fingerprint:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [accepted, rejected]
        reason:
          type: string
        resultStatus:
          type: integer
    ClientDisabledResponse:
      type: object
      required: [clientId, enabled]
      properties:
        clientId:
          type: string
        enabled:
          type: boolean
          enum: [false]
    CertificateChangeResponse:
      type: object
      required: [clientId, thumbprint, status]
      properties:
        clientId:
          type: string
        thumbprint:
          type: string
        status:
          type: string
          enum: [retired, revoked]
    SigningKeyChangeResponse:
      type: object
      required: [clientId, keyId, status]
      properties:
        clientId:
          type: string
        keyId:
          type: string
        status:
          type: string
          enum: [retired, revoked]
  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
    Thumbprint:
      name: thumbprint
      in: path
      required: true
      description: 憑證 SHA-1 指紋（十六進位）。
      schema:
        type: string
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string

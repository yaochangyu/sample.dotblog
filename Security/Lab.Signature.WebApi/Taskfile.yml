version: '3'

vars:
  API_DIR: Lab.Signature.WebApi

tasks:
  default:
    desc: 列出所有可用指令
    cmds:
      - task --list-all

  build:
    desc: 建置整個 solution
    cmds:
      - dotnet build

  test:
    desc: 執行全部測試（單元 + BDD，BDD 需要 Docker）
    cmds:
      - dotnet test

  test-unit:
    desc: 只執行單元測試（不需要 Docker）
    cmds:
      - dotnet test --filter "FullyQualifiedName!~Lab.Signature.WebApi.Tests.Features"

  test-integration:
    desc: 只執行 BDD 整合測試（需要 Docker，會用 Testcontainers 啟動 PostgreSQL）
    cmds:
      - dotnet test --filter "FullyQualifiedName~Lab.Signature.WebApi.Tests.Features"

  db-up:
    desc: 啟動本機 PostgreSQL 容器（docker-compose.yml）
    cmds:
      - docker compose up -d

  db-down:
    desc: 停止本機 PostgreSQL 容器（保留 volume 資料）
    cmds:
      - docker compose down

  ef-database-update:
    desc: 套用 EF Core Migration 到本機 PostgreSQL
    dir: "{{.API_DIR}}"
    cmds:
      - dotnet ef database update

  ef-migration-add:
    desc: '新增 EF Core Migration，用法：task ef-migration-add MIGRATION_NAME=AddXxx'
    dir: "{{.API_DIR}}"
    requires:
      vars: [MIGRATION_NAME]
    cmds:
      - dotnet ef migrations add {{.MIGRATION_NAME}}

  api-dev:
    desc: 啟動 API（開發模式，http://localhost:5232）
    dir: "{{.API_DIR}}"
    cmds:
      - dotnet run

  dev:
    desc: 一鍵啟動本機環境：啟動 PostgreSQL → 套用 Migration → 啟動 API
    cmds:
      - task: db-up
      - task: ef-database-update
      - task: api-dev

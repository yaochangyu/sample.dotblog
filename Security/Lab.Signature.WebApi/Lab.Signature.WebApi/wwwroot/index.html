<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab.Signature.WebApi — Client Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="warning-banner">
    ⚠️ 僅供教學展示，正式環境不可在瀏覽器保存或輸入 API Secret，簽章應由合作夥伴後端計算
  </div>

  <main>
    <h1>Lab.Signature.WebApi — 簽章保護 API Client Demo</h1>

    <section class="card">
      <h2>1. 合作夥伴憑證</h2>
      <p class="hint">
        點下方按鈕快速帶入 Migration Seed 的 demo 假資料（<code>demo-api-key-00N</code> /
        <code>demo-secret-00N-please-change</code>），僅供本機教學測試。
      </p>
      <div class="quick-fill">
        <button type="button" data-demo="1">帶入 demo-api-key-001</button>
        <button type="button" data-demo="2">帶入 demo-api-key-002</button>
        <button type="button" data-demo="3">帶入 demo-api-key-003</button>
      </div>
      <label>
        ApiKey
        <input id="apiKey" type="text" placeholder="demo-api-key-001" />
      </label>
      <label>
        Secret（僅教學展示，正式環境嚴禁在前端輸入/保存）
        <input id="secret" type="text" placeholder="demo-secret-001-please-change" />
      </label>
    </section>

    <section class="card">
      <h2>2. 送出正常請求</h2>
      <label>
        Method
        <select id="method">
          <option value="GET">GET /api/protected/orders/1</option>
          <option value="POST">POST /api/protected/orders</option>
        </select>
      </label>
      <label>
        Body（僅 POST 使用，需為合法 JSON）
        <textarea id="body" rows="3">{"productName":"Demo Product","amount":100}</textarea>
      </label>
      <button type="button" id="submitBtn">送出</button>
    </section>

    <section class="card">
      <h2>3. 攻擊模擬</h2>
      <p class="hint">需先成功送出一次「正常請求」，攻擊按鈕才會沿用上一次的請求資訊。</p>
      <div class="attack-buttons">
        <button type="button" id="attackTamperBody">竄改 Body（沿用舊簽章）</button>
        <button type="button" id="attackReplayNonce">重送同一 Nonce（Replay）</button>
        <button type="button" id="attackExpiredTimestamp">使用過期 Timestamp（6 分鐘前）</button>
      </div>
    </section>

    <section class="card">
      <h2>回應結果</h2>
      <div id="result" class="result">尚未送出任何請求。</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
